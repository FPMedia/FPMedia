name: Update profile README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update README and art
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a classic PAT with 'repo' scope, stored as a repo secret
          # named PROFILE_STATS_TOKEN, to include private repos in the
          # aggregate (language/LOC/art) sections. Safe to leave unset - the
          # script falls back to public-repos-only automatically.
          PROFILE_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/daily-art.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile README [skip ci]"
            git push
          fi
